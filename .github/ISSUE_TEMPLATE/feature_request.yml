name: Feature request
description: Suggest an improvement to the benchmark.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe the problem or workflow this feature would improve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like the benchmark to do?
      description: Describe the behavior you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or context
    validations:
      required: false
