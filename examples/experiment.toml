version = 1

[experiment]
data = "data/brothers"
models = [
  "ollama:qwen2.5vl:3b",
  "trocr:microsoft/trocr-base-handwritten",
]
layout = "paired"
split = "test"
content_type = "prose"
preprocess = "original"
seed = 42
limit = 100
warmup = true

[models."trocr:microsoft/trocr-base-handwritten"]
device = "auto"
num_beams = 4

[costs]
volumes = [100, 1000, 10000]

[costs.local]
model = "ollama:qwen2.5vl:3b"
# Supply your measured/quoted one-time hardware and setup costs.
# upfront_cost_usd = 0.0
# Supply estimated local operating cost for one transcription.
# operating_cost_per_sample_usd = 0.0

[costs.api]
# Change this selector to the API model used in the experiment.
model = "openai:replace-with-model-id"
# Optional direct estimate. If present, this takes precedence over token rates.
# cost_per_sample_usd = 0.0
# Otherwise enter the applicable prices per million tokens.
# input_per_million_usd = 0.0
# output_per_million_usd = 0.0
# cached_input_per_million_usd = 0.0
